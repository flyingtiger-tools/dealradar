name: DealRadar Claude Auto

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >
      github.event.issue.number == 1 &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DealRadar feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/reprise-ai-ingestion-foundation
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          base_branch: feat/reprise-ai-ingestion-foundation
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
